[project]
name = "coach"
version = "0.1.0"
description = "A minimal, read-only MCP server that lets an agent analyse my running training."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pydantic-ai-slim[anthropic,mcp]>=2.66,<3",
    "logfire>=4,<5",
]

[project.scripts]
coach-mcp = "coach.server:main"
coach-week = "coach.agents.runner:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
